# ============================================================
# 新闻智能体 · 总配置
# ============================================================
project:
  name: 新闻智能体
  timezone: Asia/Shanghai

# ------------------------------------------------------------
# Obsidian 仓库写入路径（关键：换 vault 只改这里一处）
# ------------------------------------------------------------
vault:
  news_dir: "改成你的Obsidian仓库路径"   # ⚠️ 必填：改成你自己的 Obsidian 仓库绝对路径
  index_dir: "00-索引"                    # MOC 索引
  company_dir: "01-公司"                  # 按公司归档
  digest_dir: "02-每日简报"               # 每日简报
  archive_dir: "03-原文存档"              # 原文正文快照（可选）

# ------------------------------------------------------------
# DeepSeek API（OpenAI 兼容接口）
# ------------------------------------------------------------
llm:
  provider: deepseek
  base_url: "https://api.deepseek.com"     # 若用自建/代理端点，改这里
  api_key_env: "LLM_API_KEY"             # 从环境变量读取，不写死在代码里
  model: "deepseek-v4-flash"              # ⚠️ 以账号实际可用模型名为准，务必确认
  temperature: 0.2
  json_mode: true                        # 模型是否支持 json_object 输出（OpenAI o1/o3 等不支持，设 false）
  timeout: 120
  max_retries: 3
  retry_backoff: 2.0

# ------------------------------------------------------------
# 各阶段批大小（LLM 推理节奏控制）
# ------------------------------------------------------------
classify:
  batch_size: 25

summarize:
  batch_size: 8

# ------------------------------------------------------------
# 抓取数量与过滤（前端控件控制）
# ------------------------------------------------------------
fetch:
  max_items: 60              # 每次刷新最多处理多少条（前端数量滑块）

filter:
  importance_min: 3          # 只保留 importance >= 该值的新闻（低价值过滤）
  segments: []               # 勾选保留的细分领域，空 = 不过滤


# ------------------------------------------------------------
# 中间产物目录（调试用，可随时清空）
# ------------------------------------------------------------
data:
  raw_dir: "data/raw"               # R0 归一化原始 JSON
  classified_dir: "data/classified" # R1 分类结果 JSON
  summarized_dir: "data/summarized" # R2 概括结果 JSON
  retention_days: 7                 # 中间数据保留天数，超过自动清理

# ------------------------------------------------------------
# 去重与日志
# ------------------------------------------------------------
dedup:
  db_path: "state/seen.db"          # SQLite 去重库（跨天记忆）

log:
  dir: "logs"
  level: INFO
